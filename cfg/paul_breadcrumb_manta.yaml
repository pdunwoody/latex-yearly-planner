ampmtime: true

layout:
  paper:
    width: 16.3cm
    height: 21.7cm
    reversemargins: false
    marginparwidth: 2cm
    marginparsep: 4.5mm

    margin:
      left: 0.3cm
      right: 1.4cm
      bottom: 7.5mm

  numbers:
    dailytodos: 4
    dailynotes: 15
    dailybottomhour: 6
    dailytophour: 19
    schedulelineheight: 6.6

  colors:
    lightgray: gray!65

pages:
  - name: title
    renderblocks:
      - funcname: title
        tpls:
          - title.tpl

  - name: annual
    renderblocks:
      - funcname: annual
        tpls:
          - breadcrumb_01_annual.tpl

  - name: monthly
    renderblocks:
      - funcname: monthly
        tpls:
          - breadcrumb_03_monthly.tpl

  - name: daily
    renderblocks:
      - funcname: daily
        tpls:
          - paul_breadcrumb_05_daily.tpl

  - name: daily_notes
    renderblocks:
      - funcname: daily_notes
        tpls:
          - paul_breadcrumb_07_daily_notes.tpl