ampmtime: true

layout:
  paper:
    reversemargins: false
    marginparwidth: 2cm
    marginparsep: 4.5mm

    margin:
      left: 0.3cm
      right: 1.4cm

  numbers:
    dailytodos: 12
    dailynotes: 20

pages:
  - name: title
    renderblocks:
      - funcname: title
        tpls:
          - title.tpl

  - name: annual
    renderblocks:
      - funcname: annual
        tpls:
          - mos_01_annual.tpl

  - name: monthly
    renderblocks:
      - funcname: monthly
        tpls:
          - mos_03_monthly.tpl

  - name: daily
    renderblocks:
      - funcname: daily
        tpls:
          - paul_mos_05_daily.tpl

  - name: daily_notes
    renderblocks:
      - funcname: daily_notes
        tpls:
          - paul_mos_07_daily_notes.tpl